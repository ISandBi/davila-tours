services:
  - type: web
    name: davila-tours-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --host=0.0.0.0 --port=$PORT app:app
    healthCheckPath: /
    envVars:
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DEMO_ADMIN_EMAIL
        value: admin@gmail.com
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false
      - key: QA_ACCESS_TOKEN
        sync: false
