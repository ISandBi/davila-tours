services:
  - type: web
    name: davila-tours-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --host=0.0.0.0 --port=$PORT app:app
    healthCheckPath: /
    disk:
      name: davila-tours-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/davila_tours.sqlite3
      - key: PROFILE_PHOTO_FOLDER
        value: /var/data/profile_photos
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DEMO_ADMIN_EMAIL
        value: admin@gmail.com
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false
      - key: QA_ACCESS_TOKEN
        sync: false
