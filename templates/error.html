{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<section class="section section-narrow error-page">

  <p>Regresa al inicio o continúa consultando las salidas disponibles.</p>

</section>
{% endblock %}
